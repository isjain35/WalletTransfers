databaseChangeLog:
  - changeSet:
      id: 003-create-transactions-table
      author: wallet-transfers
      comment: Create transactions table with unique reference and user FKs
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_transactions
              - column:
                  name: unique_reference
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: from_wallet_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: to_wallet_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: amount_paise
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: from_wallet_id
            referencedTableName: wallets
            referencedColumnNames: id
            constraintName: fk_transactions_from_wallet_id
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: to_wallet_id
            referencedTableName: wallets
            referencedColumnNames: id
            constraintName: fk_transactions_to_wallet_id
        - addUniqueConstraint:
            tableName: transactions
            columnNames: unique_reference, from_wallet_id
            constraintName: uk_transactions_unique_reference_from_wallet_id
